version: '3.8'

services:

  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  dice:
    build: ./
    container_name: dice
    ports:
      - "8082:8082"
    depends_on:
      - mongo
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIL_USERNAME: *******@gmail.com  #Replace with yours
      SPRING_MAIL_PASSWORD: **** **** **** **** #Replace with yours
    volumes:
      - ./uploads:/app/uploads


volumes:
  mongo_data:
