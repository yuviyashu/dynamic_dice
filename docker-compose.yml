services:

  mongo:
    image: mongo:6.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  dice:
    build: ./
    container_name: dice
    ports:
      - "8082:8082"
    depends_on:
      - mongo
    environment:
      # Values are read from your shell or a local .env file (never commit it).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET, e.g. export JWT_SECRET=$$(openssl rand -base64 32)}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    volumes:
      - ./uploads:/app/uploads

volumes:
  mongo_data:
