server:
  port: 8082

spring:
  application:
    name: dice
  data:
    mongodb:
      uri: mongodb://mongo:27017/dynamicdice
      database: dice
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:}   # set via env var / .env, never commit real values
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

file:
  upload-dir: uploads/dice

jwt:
  secret: ${JWT_SECRET}          # Base64, >= 32 bytes. Set via environment variable, never commit the real value.
  expiration-ms: 3600000         # 1 hour
